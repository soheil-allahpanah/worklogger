[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
common = { path = "../common" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "macro-diagnostics"] }
